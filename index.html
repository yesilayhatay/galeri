<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeşilay Hatay - Medya Galerisi</title>
    <style>
        :root {
            --primary-color: #006a35;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding: 20px 0; }
        h1 { color: var(--primary-color); font-size: 2.2rem; margin-bottom: 8px; }
        p.subtitle { color: #666; font-size: 1rem; }

        .filters-container { display: flex; justify-content: center; margin-bottom: 30px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn {
            background: var(--card-bg); border: 2px solid var(--primary-color); color: var(--primary-color);
            padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary-color); color: #ffffff; }

        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; max-width: 1300px; margin: 0 auto;
        }
        .card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); transition: transform 0.3s ease;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); }
        .media-container { width: 100%; height: 220px; background-color: #e9ecef; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .category-badge {
            align-self: flex-start; background-color: #e6f0eb; color: var(--primary-color);
            font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase;
        }
        .loading-text, .error-text { text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>Yeşilay Hatay Şubesi</h1>
        <p class="subtitle">Etkinlik ve Çalışma Medya Galerisi</p>
    </header>

    <div class="filters-container">
        <div class="filter-group" id="categoryFilters">
            <button class="filter-btn active" onclick="filtrele('hepsi')">Tümü</button>
        </div>
    </div>

    <main class="gallery-grid" id="galleryGrid">
        <div class="loading-text">Görseller yükleniyor, lütfen bekleyin...</div>
    </main>

    <script>
        const CLOUD_NAME = "yesilay-hatay";
        const TAG_NAME = "yesilay-hatay";
        let tumMedyaVerileri = [];

        async function cloudinaryVerileriniCek() {
            const galleryGrid = document.getElementById("galleryGrid");
            const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG_NAME}.json`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Veri okunamadı");

                const data = await response.json();
                
                tumMedyaVerileri = data.resources.map(item => {
                    const pathParts = item.public_id.split('/');
                    const kategori = pathParts.length > 1 ? pathParts[0].toUpperCase() : "GENEL";
                    const isVideo = item.format === 'mp4' || item.resource_type === 'video';

                    return {
                        url: `https://res.cloudinary.com/${CLOUD_NAME}/${isVideo ? 'video' : 'image'}/upload/v${item.version}/${item.public_id}.${item.format}`,
                        kategori: kategori,
                        isVideo: isVideo
                    };
                });

                kategoriFiltreleriniOlustur();
                galeriyiEkranaBas(tumMedyaVerileri);

            } catch (error) {
                console.error("Hata:", error);
                galleryGrid.innerHTML = `
                    <div class="error-text">
                        <p style="color:red;"><strong>İçerikler Çekilemedi!</strong></p>
                        <p style="font-size:0.9rem; margin-top:10px;">Cloudinary tarafında "yesilay-hatay" etiketinin kaydedildiğinden emin olun.</p>
                    </div>`;
            }
        }

        function kategoriFiltreleriniOlustur() {
            const categoryFiltersContainer = document.getElementById("categoryFilters");
            const kategoriler = ["hepsi", ...new Set(tumMedyaVerileri.map(item => item.kategori))];

            categoryFiltersContainer.innerHTML = kategoriler.map(kat => `
                <button class="filter-btn ${kat === 'hepsi' ? 'active' : ''}" onclick="filtrele('${kat}', this)">
                    ${kat === 'hepsi' ? 'Tümü' : kat}
                </button>
            `).join('');
        }

        function galeriyiEkranaBas(liste) {
            const galleryGrid = document.getElementById("galleryGrid");
            if (liste.length === 0) {
                galleryGrid.innerHTML = `<div class="loading-text">İçerik bulunamadı.</div>`;
                return;
            }

            galleryGrid.innerHTML = liste.map(item => `
                <div class="card">
                    <div class="media-container">
                        ${item.isVideo 
                            ? `<video src="${item.url}" controls preload="metadata"></video>` 
                            : `<img src="${item.url}" alt="${item.kategori}" loading="lazy">`
                        }
                    </div>
                    <div class="card-body">
                        <span class="category-badge">${item.kategori}</span>
                    </div>
                </div>
            `).join('');
        }

        function filtrele(kategori, btn = null) {
            if (btn) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            if (kategori === 'hepsi') {
                galeriyiEkranaBas(tumMedyaVerileri);
            } else {
                galeriyiEkranaBas(tumMedyaVerileri.filter(item => item.kategori === kategori));
            }
        }

        document.addEventListener("DOMContentLoaded", cloudinaryVerileriniCek);
    </script>
</body>
</html>
