<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeşilay Hatay Şubesi - Dijital Medya Galerisi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6.4.0 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yesilayGreen: '#16a34a',
                        yesilayDark: '#14532d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans">

    <!-- Üst Bilgi / Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-green-700 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-leaf text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Yeşilay Hatay Şubesi</h1>
                    <p class="text-xs text-slate-500 font-medium">Dijital Medya Galerisi ve Hızlı Paylaşım Paneli</p>
                </div>
            </div>
            <!-- Arama ve Filtre Alanı -->
            <div class="w-full md:w-auto flex items-center gap-2">
                <div class="relative w-full md:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Medya veya içerik ara..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-600 focus:bg-white transition-all">
                </div>
            </div>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Filtre Butonları / Kategoriler -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-thin">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 bg-green-700 text-white rounded-lg text-sm font-medium whitespace-nowrap shadow-sm transition-all">Tümü</button>
            <button onclick="filterCategory('Tütün')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">Tütün</button>
            <button onclick="filterCategory('Alkol')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">Alkol</button>
            <button onclick="filterCategory('Madde')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">Madde</button>
            <button onclick="filterCategory('Teknoloji')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">Teknoloji</button>
            <button onclick="filterCategory('Etkinlik')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">Etkinlik</button>
            <button onclick="filterCategory('YEDAM')" class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all">YEDAM</button>
        </div>

        <!-- Galeri Grid Alanı -->
        <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- İçerikler JavaScript ile dinamik yüklenecektir -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Yeşilay Hatay Şubesi - Tüm Hakları Saklıdır.
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl flex flex-col md:flex-row relative">
            <button onclick="closeLightbox()" class="absolute top-3 right-3 z-10 bg-slate-100 text-slate-700 hover:bg-red-500 hover:text-white w-9 h-9 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="md:w-1/2 bg-black flex items-center justify-center p-4 min-h-[300px]">
                <img id="lightboxImg" src="" alt="Önizleme" class="max-h-[400px] object-contain">
            </div>
            <div class="md:w-1/2 p-6 flex flex-col justify-between gap-4">
                <div>
                    <span id="lightboxCategory" class="text-xs font-semibold text-green-700 bg-green-50 px-2.5 py-1 rounded-md">Kategori</span>
                    <h3 id="lightboxTitle" class="text-lg font-bold text-slate-900 mt-2">Başlık</h3>
                    <p id="lightboxDesc" class="text-sm text-slate-600 mt-1">Açıklama alanı...</p>
                </div>
                <div class="flex flex-col gap-2 pt-4 border-t border-slate-100">
                    <button onclick="shareLink()" class="w-full py-2.5 bg-green-700 hover:bg-green-800 text-white rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-share-nodes"></i> Bağlantıyı Kopyala & Paylaş
                    </button>
                    <a id="lightboxDownload" href="#" download target="_blank" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-download"></i> Dosyayı İndir
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Uygulama Mantığı ve Veri Yönetimi -->
    <script>
        // Örnek Medya Veri Seti (GitHub ve Cloudinary link orijinal yapıları korunacak şekilde)
        const mediaItems = [
            {
                id: 1,
                title: "Bağımlılıkla Mücadele Semineri",
                category: "Etkinlik",
                description: "Hatay genelinde gerçekleştirilen bilinçlendirme seminerinden kareler.",
                url: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600", // Orijinal URL korundu
                isGitHub: false
            },
            {
                id: 2,
                title: "YEDAM Bilgilendirme Afişi",
                category: "YEDAM",
                description: "GitHub üzerinde barındırılan orijinal görselli afiş çalışması.",
                url: "https://raw.githubusercontent.com/username/repo/main/assets/yedam-afis.jpg", // GitHub bağlantısı orijinal haliyle korunuyor
                isGitHub: true
            },
            {
                id: 3,
                title: "Teknoloji Bağımlılığı Farkındalık",
                category: "Teknoloji",
                description: "Çocuklar ve gençler için güvenli teknoloji kullanımı rehberi.",
                url: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600",
                isGitHub: false
            }
        ];

        let currentFilter = 'all';
        let currentActiveItem = null;

        // Link Orijinalliği Kontrol Mekanizması
        function getAssetUrl(item) {
            // Eğer öğe GitHub kaynaklıysa veya harici orijinal link işaretlediyse doğrudan orijinal linki döndür
            if (item.isGitHub || (item.url && item.url.includes('github'))) {
                return item.url;
            }
            // Standart veya Cloudinary türetilmiş adres
            return item.url;
        }

        // Sayaç Yönetimi (Şimdilik localStorage tabanlı - Firebase'e kolayca uyarlanabilir)
        function getStats(id, type) {
            const stats = JSON.parse(localStorage.getItem('yesilay_stats') || '{}');
            if (!stats[id]) stats[id] = { likes: 0, downloads: 0, shares: 0 };
            return stats[id][type] || 0;
        }

        function incrementStat(id, type) {
            const stats = JSON.parse(localStorage.getItem('yesilay_stats') || '{}');
            if (!stats[id]) stats[id] = { likes: 0, downloads: 0, shares: 0 };
            stats[id][type]++;
            localStorage.setItem('yesilay_stats', JSON.stringify(stats));
            renderMedia();
        }

        // Galeriyi Ekrana Basma
        function renderMedia() {
            const grid = document.getElementById('mediaGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = mediaItems.filter(item => {
                const matchesCategory = currentFilter === 'all' || item.category === currentFilter;
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || item.description.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Aradığınız kriterlere uygun içerik bulunamadı.</div>`;
                return;
            }

            filtered.forEach(item => {
                const finalUrl = getAssetUrl(item);
                const likes = getStats(item.id, 'likes');
                const downloads = getStats(item.id, 'downloads');

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
                card.innerHTML = `
                    <div class="h-48 bg-slate-100 overflow-hidden relative cursor-pointer" onclick="openLightbox(${item.id})">
                        <img src="${finalUrl}" alt="${item.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">${item.category}</span>
                    </div>
                    <div class="p-4 flex flex-col gap-2">
                        <h3 class="font-bold text-slate-900 text-sm line-clamp-1">${item.title}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2">${item.description}</p>
                    </div>
                    <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                        <button onclick="incrementStat(${item.id}, 'likes')" class="flex items-center gap-1 hover:text-red-500 transition-colors">
                            <i class="fa-solid fa-heart text-red-400"></i> <span id="like-count-${item.id}">${likes}</span>
                        </button>
                        <button onclick="incrementStat(${item.id}, 'downloads')" class="flex items-center gap-1 hover:text-green-700 transition-colors">
                            <i class="fa-solid fa-download"></i> <span id="down-count-${item.id}">${downloads}</span>
                        </button>
                        <button onclick="openLightbox(${item.id})" class="text-green-700 font-medium hover:underline">İncele</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Kategori Filtreleme
        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent.trim() === category || (category === 'all' && btn.textContent.trim() === 'Tümü')) {
                    btn.className = "cat-btn px-4 py-2 bg-green-700 text-white rounded-lg text-sm font-medium whitespace-nowrap shadow-sm transition-all";
                } else {
                    btn.className = "cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-100 transition-all";
                }
            });
            renderMedia();
        }

        // Arama Dinamiği
        document.getElementById('searchInput').addEventListener('input', renderMedia);

        // Lightbox Kontrolleri
        function openLightbox(id) {
            currentActiveItem = mediaItems.find(i => i.id === id);
            if (!currentActiveItem) return;

            const finalUrl = getAssetUrl(currentActiveItem);

            document.getElementById('lightboxImg').src = finalUrl;
            document.getElementById('lightboxCategory').textContent = currentActiveItem.category;
            document.getElementById('lightboxTitle').textContent = currentActiveItem.title;
            document.getElementById('lightboxDesc').textContent = currentActiveItem.description;
            document.getElementById('lightboxDownload').href = finalUrl;

            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function shareLink() {
            if (!currentActiveItem) return;
            const finalUrl = getAssetUrl(currentActiveItem);
            navigator.clipboard.writeText(finalUrl).then(() => {
                alert("Bağlantı panoya kopyalandı!");
                incrementStat(currentActiveItem.id, 'shares');
            });
        }

        // İlk Yükleme
        renderMedia();
    </script>
</body>
</html>
