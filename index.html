### 1. Klasör Adlarını Otomatik "Category" Yapma ve Etiket Ekleme (Node.js)

Cloudinary’deki klasör yolunu (`folder`) okuyup bunu bir `context` parametresi (örneğin `category`) olarak atayan ve aynı zamanda toplu etiket (`tags`) ekleyen örnek betik:

```javascript
const cloudinary = require('cloudinary').v2;

cloudinary.config({
  cloud_name: 'yesilay-hatay',
  api_key: 'API_KEY',
  api_secret: 'API_SECRET'
});

async function autoCategorizeAndTag() {
  try {
    // 1. Belirtilen ana klasör altındaki tüm görselleri listele
    const result = await cloudinary.api.resources({
      type: 'upload',
      prefix: 'urunler/', // Görsellerinizin bulunduğu ana klasör veya boş bırakın ''
      max_results: 500
    });

    for (const asset of result.resources) {
      // Klasör yolunu parçala (Örn: "urunler/ayakkabi/foto.jpg" -> "ayakkabi")
      const pathParts = asset.public_id.split('/');
      
      if (pathParts.length > 1) {
        const categoryName = pathParts[pathParts.length - 2]; // Bir üst klasör adı
        
        // Klasör adını kategori (context) olarak ata ve etiketleri ekle
        await cloudinary.uploader.explicit(asset.public_id, {
          type: 'upload',
          context: `category=${categoryName}|status=active`,
          tags: [categoryName, 'toplu_yukleme', '2026_katalog'] // İlettiğiniz etiketler
        });

        console.log(`Güncellendi: ${asset.public_id} -> Kategori: ${categoryName}`);
      }
    }
    console.log('Tüm görseller başarıyla kategorize edildi ve etiketlendi.');
  } catch (error) {
    console.error('Hata:', error);
  }
}

autoCategorizeAndTag();
