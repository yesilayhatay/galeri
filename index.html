<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Dijital Medya Galerisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #lightboxModal { overflow: hidden !important; }
        #lightboxGorsel {
            max-width: 85vw;
            max-height: 75vh;
            object-fit: contain;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

    <div>
        <div class="max-w-7xl mx-auto p-4 md:p-8">
            <header class="mb-8 text-center">
                <div class="flex justify-center mb-4">
                    <a href="https://www.instagram.com/yesilayhatay" target="_blank" rel="noopener noreferrer" class="inline-block transition hover:opacity-90">
                        <img src="https://res.cloudinary.com/yesilay-hatay/image/upload/v1/yesilay-hatay.jpg" alt="Yeşilay Hatay" class="h-20 md:h-24 object-contain mx-auto rounded-xl shadow-sm border border-slate-200" onerror="this.style.display='none'">
                    </a>
                </div>
                <!-- SOSYAL MEDYA İKONLARI -->
                <div class="flex justify-center items-center gap-4 mb-4">
                    <a href="https://www.instagram.com/yesilayhatay" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-700 hover:text-emerald-700 hover:border-emerald-300 transition">
                        <i class="fa-brands fa-instagram text-base"></i>
                    </a>
                    <a href="https://twitter.com/yesilayhatay" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-700 hover:text-emerald-700 hover:border-emerald-300 transition">
                        <i class="fa-brands fa-x-twitter text-base"></i>
                    </a>
                    <a href="https://www.facebook.com/yesilayhatay" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-700 hover:text-emerald-700 hover:border-emerald-300 transition">
                        <i class="fa-brands fa-facebook-f text-base"></i>
                    </a>
                </div>
                <h1 class="text-3xl font-extrabold text-emerald-800 tracking-tight">Dijital Medya Galerisi</h1>
                <p class="text-slate-700 font-semibold text-base md:text-lg mt-2">İçerik Arşivleme ve Hızlı Paylaşım Paneli</p>
            </header>

            <!-- ARAMA KUTUSU -->
            <div class="mb-6 max-w-xl mx-auto">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="aramaKutusu" oninput="aramaYap(this.value)" placeholder="Dosya adı veya etiket ara (örn: alkol, tütün, etkinlik)..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 shadow-sm transition">
                </div>
            </div>

            <!-- KATEGORİ FİLTRELERİ -->
            <div class="mb-4">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Kategoriler</div>
                <div class="flex flex-wrap justify-center gap-2" id="kategoriContainer">
                    <button onclick="kategoriFiltrele('hepsi', this)" class="kat-btn bg-emerald-700 text-white px-4 py-1.5 rounded-full font-bold text-xs shadow-sm transition">
                        TÜM KATEGORİLER
                    </button>
                </div>
            </div>

            <!-- SABİT ETİKET FİLTRELERİ -->
            <div class="mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Konuya Göre Filtrele</div>
                <div class="flex flex-wrap justify-center gap-1.5">
                    <button onclick="etiketFiltrele('hepsi', this)" class="tag-btn bg-slate-800 text-white px-3 py-1 rounded-md text-xs font-medium transition">Tüm Konular</button>
                    <button onclick="etiketFiltrele('Tütün', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Tütün</button>
                    <button onclick="etiketFiltrele('Alkol', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Alkol</button>
                    <button onclick="etiketFiltrele('Madde', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Madde</button>
                    <button onclick="etiketFiltrele('Kumar', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Kumar</button>
                    <button onclick="etiketFiltrele('Teknolojik/Dijital', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Teknolojik/Dijital</button>
                    <button onclick="etiketFiltrele('Aile', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Aile</button>
                    <button onclick="etiketFiltrele('Çocuk', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Çocuk</button>
                    <button onclick="etiketFiltrele('Gençlik', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Gençlik</button>
                    <button onclick="etiketFiltrele('Eğitim', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Eğitim</button>
                    <button onclick="etiketFiltrele('Etkinlik', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Etkinlik</button>
                    <button onclick="etiketFiltrele('Gönüllülük', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Gönüllülük</button>
                    <button onclick="etiketFiltrele('Sanat', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Sanat</button>
                    <button onclick="etiketFiltrele('Yayın', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#Yayın</button>
                    <button onclick="etiketFiltrele('YEDAM', this)" class="tag-btn bg-slate-100 text-slate-600 px-3 py-1 rounded-md text-xs font-medium transition border border-slate-200">#YEDAM</button>
                </div>
            </div>

            <!-- GALERİ GRID -->
            <div id="galeriGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-12 text-slate-500 font-semibold">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-700 mb-3 block"></i>
                    Görseller yükleniyor...
                </div>
            </div>

            <div id="sayfalamaContainer" class="mt-10 flex justify-center items-center gap-2"></div>
        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightboxModal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col justify-between p-4 backdrop-blur-md select-none" onclick="lightboxKapat(event)">
        <div class="w-full flex justify-end max-w-7xl mx-auto shrink-0">
            <button onclick="lightboxKapatAjan()" class="text-white/80 hover:text-white bg-slate-900/80 border border-slate-700 p-2.5 rounded-xl text-xl z-40 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="relative flex-1 w-full flex items-center justify-center p-2 z-10">
            <img id="lightboxGorsel" src="" alt="Önizleme" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl">
            <video id="lightboxVideo" controls autoplay class="max-h-full max-w-full object-contain rounded-lg shadow-2xl hidden"></video>
        </div>
        <div class="z-40 text-center bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 text-white max-w-xl w-full mx-auto shadow-2xl shrink-0" onclick="event.stopPropagation()">
            <div class="flex justify-center items-center gap-6">
                <button id="lbHeartBtn" title="Beğen" onclick="lightboxKalpTikla()" class="transition text-xl text-slate-300 hover:text-rose-400 flex items-center gap-2">
                    <i id="lbHeartIcon" class="fa-regular fa-heart"></i>
                    <span id="lbHeartCount" class="text-sm font-bold"></span>
                </button>
                <button onclick="dosyaIndirMevcut()" title="Cihaza İndir" class="text-emerald-400 hover:text-emerald-300 text-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span id="lbDlCount" class="text-sm font-bold"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "yesilay-hatay";
        const TAG_NAME = "yesilay-hatay";
        const SAYFA_BASI_GORSEL = 20;

        const SABIT_ETIKETLER = {
            'Tütün': ['tutun', 'tütün', 'sigara', 'nikotin', 'nargile', 'vape'],
            'Alkol': ['alkol', 'icki', 'içki', 'bira', 'sarap', 'şarap', 'raki', 'rakı'],
            'Madde': ['madde', 'uyusturucu', 'uyuşturucu', 'sentetik'],
            'Kumar': ['kumar', 'bahis', 'casino', 'slot'],
            'Teknolojik/Dijital': ['teknoloji', 'dijital', 'ekran', 'siber', 'internet', 'telefon'],
            'Aile': ['aile', 'ebeveyn', 'anne', 'baba'],
            'Çocuk': ['cocuk', 'çocuk', 'ilkokul', 'kreş'],
            'Gençlik': ['genclik', 'gençlik', 'kampus', 'lise', 'universite'],
            'Eğitim': ['egitim', 'eğitim', 'tbm', 'okul', 'seminer'],
            'Etkinlik': ['etkinlik', 'organizasyon', 'festival', 'panel'],
            'Gönüllülük': ['gonullu', 'gönüllü', 'saha', 'stant'],
            'Sanat': ['sanat', 'tiyatro', 'resim', 'sergi', 'muzik'],
            'Yayın': ['yayin', 'yayın', 'dergi', 'brosur', 'broşür', 'kitap', 'afis'],
            'YEDAM': ['yedam', 'danismanlik', 'danışmanlık', '115']
        };

        let tumVeriler = [];
        let aktifKategori = 'hepsi';
        let aktifEtiket = 'hepsi';
        let aramaMetni = '';
        let mevcutSayfa = 1;
        let gorunurVeriler = [];
        let lightboxMevcutIndex = 0;

        async function sayacGetirAPI(id, tip) {
            const key = `yesilayhatay_${id}_${tip}`.replace(/[^a-zA-Z0-9_]/g, '_');
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/yesilayhatay_galeri/${key}`);
                if (!res.ok) return 0;
                const data = await res.json();
                return data.count || 0;
            } catch (err) { return 0; }
        }

        async function sayacArtirAPI(id, tip) {
            const key = `yesilayhatay_${id}_${tip}`.replace(/[^a-zA-Z0-9_]/g, '_');
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/yesilayhatay_galeri/${key}/up`);
                if (!res.ok) return 1;
                const data = await res.json();
                return data.count || 1;
            } catch (err) { return 1; }
        }

        async function kartSayaciniGuncelle(kart) {
            if (!kart) return;
            const id = kart.dataset.id;
            const heartSpan = kart.querySelector('.count-heart');
            const heartIcon = kart.querySelector('.icon-heart');
            const dlSpan = kart.querySelector('.count-download');

            const [heart, dl] = await Promise.all([
                sayacGetirAPI(id, 'heart'),
                sayacGetirAPI(id, 'download')
            ]);

            if (heartSpan) heartSpan.textContent = heart > 0 ? heart : '';
            if (dlSpan) dlSpan.textContent = dl > 0 ? dl : '';
            
            if (heartIcon) {
                if (heart > 0) {
                    heartIcon.className = "icon-heart fa-solid fa-heart text-rose-500 text-base";
                } else {
                    heartIcon.className = "icon-heart fa-regular fa-heart text-slate-400 hover:text-rose-500 text-base";
                }
            }
        }

        async function sayaclariGuncelleDOM() {
            const kartlar = document.querySelectorAll('.gorsel-kart');
            for (const kart of kartlar) {
                if (kart.style.display === 'none') continue;
                await kartSayaciniGuncelle(kart);
            }
        }

        function toSlug(str) {
            if (!str) return '';
            return str.toString().trim().toLowerCase()
                .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
                .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
                .replace(/[^a-z0-9]/g, '');
        }

        function etiketCikar(metin) {
            const t = metin.toLowerCase();
            let bulunanlar = [];
            for (const [etiket, anahtarlar] of Object.entries(SABIT_ETIKETLER)) {
                if (anahtarlar.some(k => t.includes(k)) || t.includes(etiket.toLowerCase())) {
                    bulunanlar.push(etiket);
                }
            }
            return bulunanlar.length > 0 ? bulunanlar.slice(0, 3) : ['Yayın'];
        }

        async function cloudinaryVerileriniCek() {
            const grid = document.getElementById("galeriGrid");
            const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG_NAME}.json`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Cloudinary erişim hatası");

                const data = await res.json();
                const kategorilerSet = new Set();

                tumVeriler = data.resources.map((item, idx) => {
                    const pathParts = item.public_id.split('/');
                    let kat = pathParts.length > 1 ? pathParts[0].toUpperCase() : "GENEL";
                    kategorilerSet.add(kat);

                    const ext = item.format ? item.format.toLowerCase() : '';
                    const isVid = ['mp4', 'webm', 'mov'].includes(ext) || item.resource_type === 'video';
                    const mediaUrl = `https://res.cloudinary.com/${CLOUD_NAME}/${isVid ? 'video' : 'image'}/upload/v${item.version}/${item.public_id}.${item.format}`;
                    
                    const temizPublicId = item.public_id.replace(/[-_\\/]/g, ' ');
                    const aramaHavuzu = `${temizPublicId} ${item.public_id} ${(item.tags||[]).join(' ')} ${kat}`.toLowerCase();
                    const etiketler = etiketCikar(aramaHavuzu);
                    const uniqueId = item.public_id.replace(/[^a-zA-Z0-9]/g, '_');

                    return {
                        idx: idx,
                        id: uniqueId,
                        yol: mediaUrl,
                        kategori: kat,
                        etiketler: etiketler,
                        is_video: isVid,
                        aramaHavuzu: aramaHavuzu
                    };
                });

                kategoriButonlariniCiz(Array.from(kategorilerSet));
                filtreleVeSayfala();

            } catch (err) {
                grid.innerHTML = `<div class="col-span-full bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-center my-8">İçerikler Yüklenemedi! Cloudinary etiketini kontrol edin.</div>`;
            }
        }

        function kategoriButonlariniCiz(kategoriler) {
            const container = document.getElementById('kategoriContainer');
            let html = `<button onclick="kategoriFiltrele('hepsi', this)" class="kat-btn bg-emerald-700 text-white px-4 py-1.5 rounded-full font-bold text-xs shadow-sm transition">TÜM KATEGORİLER</button>`;
            kategoriler.forEach(kat => {
                html += `<button onclick="kategoriFiltrele('${kat}', this)" class="kat-btn bg-white hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full font-bold text-xs shadow-sm transition">${kat}</button>`;
            });
            container.innerHTML = html;
        }

        function filtreleVeSayfala() {
            const slugKat = toSlug(aktifKategori);
            const slugTag = toSlug(aktifEtiket);

            gorunurVeriler = tumVeriler.filter(item => {
                const katUyum = (aktifKategori === 'hepsi' || toSlug(item.kategori) === slugKat);
                const etiketUyum = (aktifEtiket === 'hepsi' || item.etiketler.some(e => toSlug(e) === slugTag));
                
                let aramaUyum = true;
                if (aramaMetni !== '') {
                    const kelimeler = aramaMetni.split(' ');
                    aramaUyum = kelimeler.every(kelime => item.aramaHavuzu.includes(kelime));
                }
                return katUyum && etiketUyum && aramaUyum;
            });

            const toplamSayfa = Math.ceil(gorunurVeriler.length / SAYFA_BASI_GORSEL) || 1;
            if (mevcutSayfa > toplamSayfa) mevcutSayfa = 1;

            galeriKartlariniCiz();
            sayfalamaButonlariCiz(toplamSayfa);
        }

        function galeriKartlariniCiz() {
            const grid = document.getElementById('galeriGrid');
            if (gorunurVeriler.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-semibold">Aradığınız kriterlere uygun içerik bulunamadı.</div>`;
                document.getElementById('sayfalamaContainer').innerHTML = '';
                return;
            }

            const baslangic = (mevcutSayfa - 1) * SAYFA_BASI_GORSEL;
            const sayfadakiVeriler = gorunurVeriler.slice(baslangic, baslangic + SAYFA_BASI_GORSEL);

            grid.innerHTML = sayfadakiVeriler.map(item => `
                <div class="gorsel-kart bg-white rounded-xl shadow-md overflow-hidden flex flex-col transition hover:shadow-lg border border-slate-200" data-id="${item.id}">
                    <div class="relative bg-slate-900/5 h-64 flex items-center justify-center p-3 cursor-pointer group" onclick="lightboxAcById('${item.id}')">
                        <img src="${item.yol}" alt="Görsel" class="max-h-full max-w-full object-contain rounded" loading="lazy">
                        <span class="absolute top-3 left-3 bg-emerald-800/90 text-white text-xs px-2.5 py-1 rounded-md font-bold">${item.kategori}</span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between bg-white">
                        <div class="flex flex-wrap gap-1 mb-3">
                            ${item.etiketler.map(e => `<span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-0.5 rounded border border-emerald-100 font-medium">#${e}</span>`).join('')}
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 px-1">
                            <button onclick="kalpTikla(event, '${item.id}')" title="Beğen" class="flex items-center gap-1.5 transition text-rose-600 hover:scale-105">
                                <i class="icon-heart fa-regular fa-heart text-slate-400 text-base"></i>
                                <span class="font-bold count-heart"></span>
                            </button>
                            <button onclick="dosyaIndirKartTikla(event, '${item.yol}', '${item.id}', '${item.yol.split('/').pop()}')" title="Cihaza İndir" class="flex items-center gap-1.5 hover:text-emerald-700 transition">
                                <i class="fa-solid fa-download text-slate-600 text-base"></i>
                                <span class="font-bold count-download"></span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            sayaclariGuncelleDOM();
        }

        function aramaYap(deger) {
            aramaMetni = deger.toLowerCase().trim();
            mevcutSayfa = 1;
            filtreleVeSayfala();
        }

        function sayfalamaButonlariCiz(toplamSayfa) {
            const container = document.getElementById('sayfalamaContainer');
            if (!container || toplamSayfa <= 1) { container.innerHTML = ''; return; }
            let html = `<button onclick="sayfaDegistir(${mevcutSayfa - 1})" ${mevcutSayfa === 1 ? 'disabled class="opacity-40 bg-white px-3 py-1.5 rounded-lg border text-xs"' : 'class="bg-white px-3 py-1.5 rounded-lg border text-xs font-semibold"'}>Önceki</button>`;
            html += `<span class="text-xs font-bold px-2">Sayfa ${mevcutSayfa} / ${toplamSayfa}</span>`;
            html += `<button onclick="sayfaDegistir(${mevcutSayfa + 1})" ${mevcutSayfa === toplamSayfa ? 'disabled class="opacity-40 bg-white px-3 py-1.5 rounded-lg border text-xs"' : 'class="bg-white px-3 py-1.5 rounded-lg border text-xs font-semibold"'}>Sonraki</button>`;
            container.innerHTML = html;
        }

        function sayfaDegistir(yeni) { mevcutSayfa = yeni; galeriKartlariniCiz(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function kategoriFiltrele(kat, btn) { aktifKategori = kat; aktifEtiket = 'hepsi'; mevcutSayfa = 1; filtreleVeSayfala(); }
        function etiketFiltrele(tag, btn) { aktifEtiket = tag; aktifKategori = 'hepsi'; mevcutSayfa = 1; filtreleVeSayfala(); }

        async function lightboxAcById(id) {
            lightboxMevcutIndex = gorunurVeriler.findIndex(item => item.id === id);
            if (lightboxMevcutIndex === -1) lightboxMevcutIndex = 0;
            const item = gorunurVeriler[lightboxMevcutIndex];
            document.getElementById('lightboxGorsel').src = item.yol;
            const modal = document.getElementById('lightboxModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            
            // Lightbox içindeki sayaç ve ikonları güncelle
            const [heart, dl] = await Promise.all([
                sayacGetirAPI(item.id, 'heart'),
                sayacGetirAPI(item.id, 'download')
            ]);
            document.getElementById('lbHeartCount').textContent = heart > 0 ? heart : '';
            document.getElementById('lbDlCount').textContent = dl > 0 ? dl : '';
            const lbIcon = document.getElementById('lbHeartIcon');
            if (heart > 0) {
                lbIcon.className = "fa-solid fa-heart text-rose-500";
            } else {
                lbIcon.className = "fa-regular fa-heart text-slate-300";
            }
        }

        function lightboxKapat(e) { if (e.target.id === 'lightboxModal') lightboxKapatAjan(); }
        function lightboxKapatAjan() {
            document.getElementById('lightboxModal').classList.add('hidden');
            document.getElementById('lightboxModal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        async function kalpTikla(event, id) {
            event.stopPropagation();
            await sayacArtirAPI(id, 'heart');
            const kart = document.querySelector(`.gorsel-kart[data-id="${id}"]`);
            if (kart) await kartSayaciniGuncelle(kart);
        }

        async function lightboxKalpTikla() {
            const item = gorunurVeriler[lightboxMevcutIndex];
            if (item) {
                await sayacArtirAPI(item.id, 'heart');
                const kart = document.querySelector(`.gorsel-kart[data-id="${item.id}"]`);
                if (kart) await kartSayaciniGuncelle(kart);
                
                const heart = await sayacGetirAPI(item.id, 'heart');
                document.getElementById('lbHeartCount').textContent = heart > 0 ? heart : '';
                document.getElementById('lbHeartIcon').className = "fa-solid fa-heart text-rose-500";
            }
        }

        async function dosyaIndirKartTikla(event, yol, id, dosyaAdi) {
            event.stopPropagation();
            await sayacArtirAPI(id, 'download');
            const kart = document.querySelector(`.gorsel-kart[data-id="${id}"]`);
            if (kart) await kartSayaciniGuncelle(kart);
            dosyayiIndir(yol, dosyaAdi);
        }

        async function dosyaIndirMevcut() {
            const item = gorunurVeriler[lightboxMevcutIndex];
            if (item) {
                await sayacArtirAPI(item.id, 'download');
                const kart = document.querySelector(`.gorsel-kart[data-id="${item.id}"]`);
                if (kart) await kartSayaciniGuncelle(kart);
                
                const dl = await sayacGetirAPI(item.id, 'download');
                document.getElementById('lbDlCount').textContent = dl > 0 ? dl : '';
                
                const dosyaAdi = item.yol.split('/').pop();
                dosyayiIndir(item.yol, dosyaAdi);
            }
        }

        function dosyayiIndir(url, filename) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = filename || 'yesilay-medya';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    window.open(url, '_blank');
                });
        }

        document.addEventListener('DOMContentLoaded', cloudinaryVerileriniCek);
    </script>
</body>
</html>
